    <title>La Mamacita Massas Delivery - Cardápio Digital</title>
    <style>
        :root {
            --gold: #f5a623;
            --gold-dark: #d48806;
            --black-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html { background-color: #000; color-scheme: dark; }
        body {
            background-color: var(--black-bg);
            color: var(--text-light);
            padding-bottom: 120px;
        }

        header {
            background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
            border-bottom: 2px solid var(--gold);
            padding: 24px 16px;
            text-align: center;
        }

        .logo-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 166, 35, 0.3);
            line-height: 1;
        }

        .logo-subtitle {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            margin-top: -5px;
        }

        .tagline {
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .nav-tabs {
            display: flex;
            background: #181818;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
            background: rgba(245, 166, 35, 0.05);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ACCORDION / CAMADAS */
        .accordion-item {
            margin-bottom: 12px;
            border: 1px solid #333;
            border-radius: var(--border-radius);
            overflow: hidden;
            background: var(--card-bg);
        }

        .accordion-header {
            width: 100%;
            background: #252525;
            color: var(--gold);
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 12px;
            background: #181818;
        }

        .accordion-item.active .accordion-body {
            padding: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a2a;
        }

        .item-info {
            flex: 1;
            padding-right: 12px;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .item-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .item-price {
            color: var(--gold);
            font-weight: bold;
            margin-top: 6px;
            font-size: 1.05rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            background-color: var(--gold);
            color: #000;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .marmita-box {
            background: #1a1813;
            border: 1px solid var(--gold);
            padding: 18px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .status-banner {
            background: rgba(245, 166, 35, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .marmita-options {
            display: flex;
            gap: 10px;
            margin: 14px 0;
        }

        .marmita-btn {
            flex: 1;
            background: #252525;
            border: 2px solid #444;
            padding: 14px 10px;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .marmita-btn.active {
            border-color: var(--gold);
            background: rgba(245, 166, 35, 0.2);
            color: var(--gold);
        }

        /* ESTILIZAÇÃO DOS BOTÕES DE PRATOS E ACOMPANHAMENTOS (ACESSIBILIDADE / IDOSOS) */
        .section-subtitle {
            font-size: 1.15rem;
            color: var(--gold);
            margin: 16px 0 10px;
            font-weight: bold;
        }

        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            border: 2px solid #3d3d3d;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .checkbox-item span.item-text {
            font-size: 1.25rem; /* Fonte aumentada para leitura clara */
            font-weight: bold;
            color: #ffffff;
        }

        .checkbox-item input {
            display: none; /* Oculta o checkbox padrão pequeno */
        }

        /* Caixa de Seleção Personalizada Grandinha */
        .custom-check {
            width: 28px;
            height: 28px;
            border: 2px solid var(--gold);
            border-radius: 6px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .custom-check::after {
            content: '✓';
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            display: none;
        }

        .checkbox-item input:checked + .custom-check {
            background: var(--gold);
        }

        .checkbox-item input:checked + .custom-check::after {
            display: block;
        }

        .checkbox-item:has(input:checked) {
            border-color: var(--gold);
            background: rgba(245, 166, 35, 0.15);
        }

        /* ===== POPUP DE ENTREGA: cabe na area visivel (acima do teclado), botoes sempre a vista ===== */
        #entrega-modal {
            align-items: center;
            overflow: hidden;
            padding: 6px 0;
            box-sizing: border-box;
        }
        #entrega-modal .custom-modal {
            display: flex;
            flex-direction: column;
            width: 92%;
            max-width: 420px;
            max-height: calc(100% - 4px) !important;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            text-align: left;
        }
        #entrega-modal .em-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 18px 18px 4px;
        }
        #entrega-modal .em-foot {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            padding: 10px 18px 14px;
            border-top: 1px solid #333;
            background: #1e1e1e;
        }
        #entrega-modal .form-group { margin-bottom: 14px; }
        #entrega-modal .form-group label { margin-bottom: 6px; }
        #entrega-modal .form-section-title { margin: 0 0 14px; }
        #entrega-modal .em-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
        #entrega-modal .em-row.troco-on { grid-template-columns: 1.2fr 1fr; }
        #entrega-modal .em-row .form-group { margin: 0; min-width: 0; }
        #entrega-modal .em-foot .modal-btn { flex: 1; width: auto; padding: 13px 10px; }

        /* teclado aberto: modo compacto (mesmo visual, menos espaco vazio) */
        #entrega-modal.kb .em-body { padding: 10px 14px 2px; }
        #entrega-modal.kb .form-section-title { font-size: .95rem; margin-bottom: 8px; padding-bottom: 4px; }
        #entrega-modal.kb .form-group, #entrega-modal.kb .em-row { margin-bottom: 8px; }
        #entrega-modal.kb .form-group label { font-size: .85rem; margin-bottom: 3px; }
        #entrega-modal.kb .form-group input,
        #entrega-modal.kb .form-group select,
        #entrega-modal.kb .form-group textarea { padding: 8px 10px; }
        #entrega-modal.kb .form-group textarea { min-height: 0; }
        #entrega-modal.kb .em-foot { padding: 8px 14px 10px; }
        #entrega-modal.kb .em-foot .modal-btn { padding: 11px 8px; }

        .form-group label.checkbox-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0;
        }

        .btn-add-marmita {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .form-section-title {
            font-size: 1.2rem;
            color: var(--gold);
            border-bottom: 1px solid var(--gold);
            padding-bottom: 6px;
            margin: 24px 0 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 1rem;
            color: #ddd;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 1px solid var(--gold);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            z-index: 2147483647 !important;
            gap: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-reset {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-order {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* MODAL PERSONALIZADO */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .custom-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .custom-modal {
            background: #1e1e1e;
            border: 2px solid var(--gold);
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(245, 166, 35, 0.25);
        }

        .modal-logo {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 2.2rem;
            color: var(--gold);
            line-height: 1;
        }

        .modal-subtitle {
            font-size: 1rem;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .modal-message {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        /* REMOVE ELEMENTOS NETLIFY */
        #netlify-badge, .netlify-badge, iframe[src*="netlify"],
        [class*="netlify"], [id*="netlify"], net-lify, netlify-drawer {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }
    .off{opacity:.4;pointer-events:none}

        function renderAll() {

            lan.forEach(c => renderCategory(c.itens, 'cat-' + c.id));
            const lista = (tipo, extra) => MENU.cats.filter(c => c.tipo === tipo).flatMap(c => c.itens).filter(p => p.lib).map(p => `<label class="checkbox-item ${p.pausado ? 'off' : ''}"><span class="item-text">${p.name}${p.pausado ? ' (indisponível)' : ''}</span><input type="checkbox" ${extra} value="${p.name}" ${p.pausado ? 'disabled' : ''}><div class="custom-check"></div></label>`).join('');

            b.innerText = l.join('  |  ');

        async function carregar() {
            if (API.startsWith('COLE')) return;
            try {

                estado = r.estado; bannerCozinha();

        function toggleAccordion(headerBtn) {
            const item = headerBtn.parentElement;
            const body = item.querySelector('.accordion-body');
            const isActive = item.classList.contains('active');

            document.querySelectorAll('.accordion-item').forEach(el => {
                el.classList.remove('active');
                el.querySelector('.accordion-body').style.maxHeight = null;
            });

            if (!isActive) {
                item.classList.add('active');
                body.style.maxHeight = body.scrollHeight + "px";
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tab === 'lanches') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-lanches').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-marmitas').classList.add('active');
            }
        }

        function estaLiberadoAlmoco() {
            const agora = new Date();
            const diaSemana = agora.getDay();
            const hora = agora.getHours();
            const minuto = agora.getMinutes();

            if (diaSemana === 6 || diaSemana === 0) return true;
            if (diaSemana === 5 && (hora > 23 || (hora === 23 && minuto >= 59))) return true;

            return false;
        }

        function verificarLiberacaoAlmoco() {
            const status = document.getElementById('status-marmita');
            if (estaLiberadoAlmoco()) {
                status.innerText = "Marmitas de quinta a segunda. Consulte a disponibilidade do dia.";
            } else {
                status.innerText = "Marmitas de quinta a segunda. Consulte a disponibilidade do dia.";
            }
        }

        function updateQty(id, change, price) {
            if (!cart[id]) cart[id] = { qty: 0, price: price };
            cart[id].qty = Math.max(0, cart[id].qty + change);
            document.getElementById(`qty-${id}`).innerText = cart[id].qty;

            const activeAccordion = document.querySelector('.accordion-item.active .accordion-body');
            if (activeAccordion) {
                activeAccordion.style.maxHeight = activeAccordion.scrollHeight + "px";
            }

            calculateTotal();
        }

            document.getElementById('btn-1-opcao').classList.toggle('active', tam === 1);
            document.getElementById('btn-2-opcoes').classList.toggle('active', tam === 2);
        }

        function gerenciarSelecaoPratos(checkbox) {
            if (checkbox.checked) {
                historicoSelecaoPratos.push(checkbox);
                if (historicoSelecaoPratos.length === 2) showCustomAlert("A segunda proteína custa mais R$ 2,00.");
                if (historicoSelecaoPratos.length > limiteMaximoPratos) {
                    const maisAntigo = historicoSelecaoPratos.shift();
                    maisAntigo.checked = false;
                }
            } else {
                historicoSelecaoPratos = historicoSelecaoPratos.filter(item => item !== checkbox);
            }
        }

        function addMarmita() {
            const mains = Array.from(document.querySelectorAll('input[name="prato"]:checked')).map(cb => cb.value);
            const sides = Array.from(document.querySelectorAll('.side-dish:checked')).map(cb => cb.value);

            if (mains.length === 0) {
                showCustomAlert("Por favor, selecione pelo menos uma opção de prato principal.");
                return;
            }

            marmitas.push({
                type: tipoMarmitaTexto,
                price: precoMarmitaAtual + (mains.length > 1 ? EXTRA_PROT : 0),
                mains: mains,
                sides: sides
            });

            document.querySelectorAll('input[name="prato"], .side-dish').forEach(cb => cb.checked = false);
            historicoSelecaoPratos = [];
            showCustomAlert("Marmita adicionada ao pedido com sucesso!");
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            Object.keys(cart).forEach(id => {
                total += cart[id].qty * cart[id].price;
            });
            marmitas.forEach(m => total += m.price);
            document.getElementById('total-display').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }
